services:
  db:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: virtual_psychologist
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  fastapi:
    build: .
    env_file:
      - .env
    ports:
      - "5000:5000"  
    volumes:
      - ./logs:/app/logs
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      - db


  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"  
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  
    depends_on:
      - fastapi

volumes:
  db_data:  
  huggingface_cache:  